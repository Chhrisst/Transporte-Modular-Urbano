<header class="topbar">
  <a routerLink="/" class="brand">UrbanRide</a>
  <nav>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/nosotros" routerLinkActive="active">Nosotros</a>
    <a routerLink="/contacto" routerLinkActive="active">Contacto</a>
  </nav>
  <div class="session" *ngIf="session() as current; else guest">
    <span>Hola, {{ current.user.fullName }}</span>
    <a
      *ngIf="current.mode === 'administrador'"
      routerLink="/panel"
      class="btn btn-outline"
      routerLinkActive="active"
      >Panel</a
    >
    <button type="button" (click)="cerrarSesion()">Salir</button>
  </div>
  <ng-template #guest>
    <div class="session">
      <a routerLink="/ingreso" class="btn">Login</a>
      <a routerLink="/registro" class="btn btn-accent">Regístrate</a>
      <a routerLink="/admin/acceso" class="btn btn-outline">Admin</a>
    </div>
  </ng-template>
</header>
