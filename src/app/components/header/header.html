<header class="topbar">
  <a routerLink="/" class="brand">ModuTransit</a>
  <nav>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/boletos" routerLinkActive="active">Boletos</a>
    <a routerLink="/registro" routerLinkActive="active">Registro</a>
    <a routerLink="/panel" routerLinkActive="active">Panel</a>
  </nav>
  <div class="session" *ngIf="session() as current; else guest">
    <span>{{ current.user.fullName }}</span>
    <button type="button" (click)="cerrarSesion()">Salir</button>
  </div>
  <ng-template #guest>
    <div class="session">
      <a routerLink="/ingreso" class="btn">Ingresar</a>
      <a routerLink="/admin/acceso" class="btn btn-outline">Admin</a>
    </div>
  </ng-template>
</header>
