<header class="main-header">
    <div class="header-content">

        <a routerLink="/" class="logo">
            POWER UP <span class="logo-subtitle">Components</span>
        </a>

        <nav class="main-nav">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
            <a routerLink="/nosotros" routerLinkActive="active">Nosotros</a>
            <a routerLink="/productos" routerLinkActive="active">Productos</a>
            <a routerLink="/carrito" routerLinkActive="active">Carrito</a>
        </nav>

        <div class="auth-area" *ngIf="(usuarioActual$ | async) as usuario; else loginLink">
            <span class="user-greeting">Hola, {{ usuario.nombre }}</span>
            <button type="button" class="btn-logout" (click)="cerrarSesion()">Cerrar sesi&oacute;n</button>
        </div>

        <ng-template #loginLink>
            <a routerLink="/login" class="btn-action">
                Acceso
            </a>
        </ng-template>
    </div>
</header>
