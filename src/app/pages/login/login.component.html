<section class="login-section">
    <div class="login-card">
        <h1 class="login-title">Acceso a tu cuenta</h1>
        <p class="login-subtitle">Ingresa tus credenciales para continuar con tu compra.</p>

        <form #loginForm="ngForm" (ngSubmit)="iniciarSesion(loginForm)" novalidate>
            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input
                    id="correo"
                    name="correo"
                    type="email"
                    required
                    [(ngModel)]="credenciales.correo"
                    autocomplete="email">
            </div>

            <div class="form-group">
                <label for="clave">Contrase&ntilde;a</label>
                <input
                    id="clave"
                    name="clave"
                    type="password"
                    required
                    minlength="6"
                    [(ngModel)]="credenciales.clave"
                    autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login" [disabled]="loginForm.invalid || cargando">
                {{ cargando ? 'Validando...' : 'Iniciar sesión' }}
            </button>
        </form>

        <p *ngIf="mensaje" class="login-message" [ngClass]="{ 'error': esError, 'success': !esError }">
            {{ mensaje }}
        </p>

        <a routerLink="/productos" class="back-link">Volver al cat&aacute;logo</a>
    </div>
</section>
