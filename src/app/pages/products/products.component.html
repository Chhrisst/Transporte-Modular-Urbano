<section class="products-section">
    <div class="section-header">
        <h2 class="section-title-products">CATÁLOGO DE PRODUCTOS</h2>
        <p class="section-subtitle-products">Encuentra los componentes que necesitas para potenciar tu juego.</p>
    </div>

    <div class="category-filter-container">
        <label for="categoria">Filtrar por Categoría:</label>
        <select id="categoria" [(ngModel)]="categoriaSeleccionada" (ngModelChange)="actualizarProductosFiltrados()">
            <option *ngFor="let categoria of categorias" [value]="categoria">{{ categoria }}</option>
        </select>
    </div>

    <div class="course-grid">
        <div class="course-card" [ngClass]="{'featured': producto.destacado}" *ngFor="let producto of productosFiltrados">

            <div class="card-image-container">
                <img [src]="producto.imagenUrl" [alt]="producto.nombre" class="course-image">
            </div>

            <div class="card-content">
                <h3>{{ producto.nombre }}</h3>
                <p>{{ producto.descripcion }}</p>

                <div class="card-details">
                    <span class="detail-tag tag-time">Precio: ${{ producto.precio }}</span>
                    <span class="detail-tag"
                          [ngClass]="{'tag-premium': producto.stock > 0 && producto.stock <= 5, 'tag-available': producto.stock > 5, 'tag-soldout': producto.stock === 0}">
                        Stock: {{ producto.stock > 0 ? (producto.stock > 5 ? 'En Stock' : ('Últimas ' + producto.stock)) : 'Agotado' }}
                    </span>
                    <span *ngIf="producto.destacado" class="detail-tag tag-premium">&iexcl;OFERTA!</span>
                </div>

                <div class="button-group">
                    <button class="btn-enroll" (click)="agregarAlCarrito(producto)" [disabled]="producto.stock === 0">
                        A&Ntilde;ADIR AL CARRITO
                    </button>
                    <button class="btn-details" (click)="verDetalles(producto.id)">
                        VER DETALLES
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>
