<section class="admin-login">
  <div class="admin-login__panel">
    <h1>Acceso al panel administrativo</h1>
    <p>Monitorea rutas, flota eléctrica y usuarios desde un solo entorno de control.</p>

    <form (ngSubmit)="login()" novalidate>
      <div class="form-group">
        <label for="email">Correo corporativo</label>
        <input id="email" type="email" name="email" [(ngModel)]="email" required />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" name="password" [(ngModel)]="password" required />
      </div>

      <button class="btn-primary" type="submit">Ingresar al panel</button>
    </form>

    <p class="admin-login__feedback" *ngIf="feedback() as message">{{ message }}</p>

    <p class="admin-login__back">
      ¿Eres pasajero? <a routerLink="/ingreso">Inicia sesión aquí</a>
    </p>
  </div>
</section>
